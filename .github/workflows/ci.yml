name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Type-checks and builds the UI. The Rust side embeds the result, so it
      # has to exist before anything is compiled.
      - name: Build the UI
        run: npm run build

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run the Rust tests
        working-directory: src-tauri
        run: cargo test --lib
