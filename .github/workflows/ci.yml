name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Type-checks and builds the UI. The Rust side embeds the result, so it
      # has to exist before anything is compiled.
      - name: Build the UI
        run: npm run build

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            src-tauri

      - name: Test the shared core
        working-directory: core
        run: cargo test

      - name: Test the Windows app
        working-directory: src-tauri
        run: cargo test --lib

  # The protocol and session code is shared with the Mac app, so it has to
  # build and pass its tests there too.
  core-on-macos:
    name: Shared core on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            macos/bridge

      - name: Test the shared core
        working-directory: core
        run: cargo test

      # Compiled only: they need a Bluetooth permission no build machine has.
      - name: Build the Mac app and its tools
        run: |
          BUILD_ONLY=1 macos/run.sh probe
          BUILD_ONLY=1 macos/run.sh session
          BUILD_ONLY=1 macos/run.sh app
