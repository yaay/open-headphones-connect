name: Bug report
description: Something in the app itself is broken (window, tray icon, installer…).
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the app's settings page.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Headphones
      placeholder: WH-1000XM3
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag `%LocalAppData%\dev.openheadphonesconnect.desktop\logs\app.log` into this box if you can.
