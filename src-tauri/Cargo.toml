[package]
name = "open-headphones-connect"
version = "0.2.1"
description = "Unofficial companion for Sony headphones on Windows"
authors = ["Open Headphones Connect contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/yaay/open-headphones-connect"

[lib]
name = "open_headphones_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
windows-collections = "0.2"

[dependencies.windows]
version = "0.61"
features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_Rfcomm",
  "Devices_Enumeration",
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "UI",
  "UI_ViewManagement",
  "Win32_Foundation",
  "Win32_Devices_Bluetooth",
  "Win32_Networking_WinSock",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
